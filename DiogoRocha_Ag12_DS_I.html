<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Título da aba do navegador -->
    <meta charset="UTF-8">
    <title>Meus sites favoritos</title>
    <!-- Estilização visual para deixar a página bonita -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 30px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
        }
        .card {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: inline-block;
            margin: 15px;
            padding: 20px;
            width: 250px;
            vertical-align: top;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h2 {
            font-size: 20px;
            color: #34495e;
            margin-bottom: 15px;
        }
        .card img {
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <!-- Título principal no corpo da página -->
    <h1>Meus sites favoritos: Diogo Rocha Pereira</h1>
    <p>Conheça abaixo os meus sites favoritos para estudos e entretenimento.</p>
    <br>

    <!-- 1. YouTube -->
    <div class="card">
        <h2>YouTube</h2>
        <a href="https://www.youtube.com" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube" width="120">
        </a>
        <br><br>
        <a class="btn" href="https://www.youtube.com" target="_blank">Visitar YouTube</a>
    </div>

    <!-- 2. Spotify -->
    <div class="card">
        <h2>Spotify</h2>
        <a href="https://www.spotify.com" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/26/Spotify_logo_with_text.svg" alt="Spotify" width="120">
        </a>
        <br><br>
        <a class="btn" href="https://www.spotify.com" target="_blank">Visitar Spotify</a>
    </div>

    <!-- 3. Facebook -->
    <div class="card">
        <h2>Facebook</h2>
        <a href="https://www.facebook.com" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Facebook_Logo_%282019%29.svg" alt="Facebook" width="120">
        </a>
        <br><br>
        <a class="btn" href="https://www.facebook.com" target="_blank">Visitar Facebook</a>
    </div>

    <!-- 4. EaDTEC -->
    <div class="card">
        <h2>EaDTEC</h2>
        <a href="https://eadtec.cps.sp.gov.br" target="_blank">
            <img src="Eadtec.png" alt="EaDTEC" width="120">
        </a>
        <br><br>
        <a class="btn" href="https://eadtec.cps.sp.gov.br" target="_blank">Visitar EaDTEC</a>
    </div>

    <!-- 5. Portal Univesp -->
    <div class="card">
        <h2>Portal Univesp</h2>
        <a href="https://univesp.br" target="_blank">
            <img src="Univesp.png" alt="Portal Univesp" width="120">
        </a>
        <br><br>
        <a class="btn" href="https://univesp.br" target="_blank">Portal Univesp</a>
    </div>

</body>
</html>
